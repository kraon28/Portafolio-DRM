const NAV=[[{en:"About me",es:"Sobre mí",ca:"Sobre mi"},"/"],[{en:"Resume",es:"Currículum",ca:"Currículum"},"/resume"],[{en:"Certificates",es:"Certificados",ca:"Certificats"},"/certificates"],[{en:"Projects",es:"Proyectos",ca:"Projectes"},"/projects"],[{en:"7 HHEP",es:"7 HHEP",ca:"7 HHEP"}],[{en:"Contact",es:"Contacto",ca:"Contacte"}]];
let path="/";
function renderHead(){
 const hd=document.getElementById("hd");

 hd.innerHTML=`<div class="hin"><a class="logo" href="#/"><i></i>Daniel Rabadan</a><nav>${items}</nav><div style="display:flex;gap:12px;align-items:center"><span class="lang">${I("globe",14,"gl")}${["en","es","ca"].map(l=>`<button data-l="${l}" class="${l===lang?"on":""}">${l.toUpperCase()}</button>`).join("")}</span><button class="hbtn" id="hb" aria-label="Menu">${I("menu",20)}</button></div></div><div class="ll" style="position:static;opacity:.6"></div>`;
 document.getElementById("mm").innerHTML=NAV.map((n,i)=>n[1]?`<a href="#${n[1]}" style="color:${n[1]===path?"var(--ac)":"#fff"}"><small>0${i+1}</small>${tr(n[0])}</a>`:`<div><small>0${i+1}</small>${tr(n[0])}</div>`).join("");
 hd.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()});
 const mm=document.getElementById("mm");document.getElementById("hb").onclick=()=>{mm.classList.toggle("open");document.getElementById("hb").innerHTML=mm.classList.contains("open")?I("x",20,"lm"):I("menu",20)};
 mm.querySelectorAll("a").forEach(a=>a.onclick=()=>mm.classList.remove("open"));
 hd.classList.toggle("sc",scrollY>20);
}
let io;
function reveal(){
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
 document.querySelectorAll(".rv").forEach(e=>io.observe(e));
}
function render(){
 const h=location.hash||"#/";const r=h.startsWith("#/")?h.slice(1):"/";
 path=routes[r]?r:"/";
 document.getElementById("app").innerHTML=routes[path]();
 document.documentElement.lang=lang;
 const bg=document.getElementById("bg");
 bg.className=path==="/"?"":"nz";
 bg.innerHTML=path==="/"?"":`<div class="gridb"></div><div class="glow gs" style="top:25%;left:-8rem;width:420px;height:420px;background:rgba(200,245,96,.08)"></div>${path==="/certificates"?'<div class="glow gs" style="bottom:25%;right:0;width:380px;height:380px;background:rgba(200,245,96,.06)"></div>':""}`;
 renderHead();
 if(path!=="/"){document.querySelectorAll("#app .card,#app .hbanner,#app .stats").forEach(e=>e.classList.add("rv","up"))}
 const f=document.getElementById("f");
 if(f)f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),b=document.getElementById("sb");
  b.innerHTML=I("send",16)+" "+tr({en:"Transmitting…",es:"Enviando…",ca:"Enviant…"});
  location.href="mailto:rabadandani9@gmail.com?subject="+encodeURIComponent("Portfolio message from "+d.get("n"))+"&body="+encodeURIComponent(d.get("m")+"\n\n"+d.get("e"));
  setTimeout(()=>{b.innerHTML=I("send",16)+" "+tr({en:"Transmitted ✓",es:"Enviado ✓",ca:"Enviat ✓"});f.reset()},600);
  setTimeout(()=>{b.innerHTML=I("send",16)+" "+tr({en:"Send message",es:"Enviar mensaje",ca:"Enviar missatge"})},4600)};
 document.querySelectorAll(".sb").forEach(c=>c.onclick=()=>{sel=+c.dataset.s;document.querySelectorAll(".sb").forEach((x,i)=>x.classList.toggle("on",i===sel));document.getElementById("pan").innerHTML=softPanel()});
 const nm=document.getElementById("nm");
 if(nm&&!matchMedia("(prefers-reduced-motion:reduce)").matches)onmousemove=e=>{const r=nm.getBoundingClientRect();nm.style.transform=`perspective(800px) rotateY(${(e.clientX-r.left-r.width/2)/r.width*5}deg) rotateX(${-(e.clientY-r.top-r.height/2)/r.height*5}deg)`};else onmousemove=null;
 document.querySelectorAll('.glass,.card').forEach(e=>e.classList.add('spot'));tick();reveal();prog();
}
function tick(){const c=document.getElementById("clk");if(c)c.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
setInterval(tick,1000);
addEventListener("scroll",()=>{const h=document.getElementById("hd");h&&h.classList.toggle("sc",scrollY>20)},{passive:true});

const tt=document.getElementById("totop");tt.innerHTML=I("arrowUp",20);
tt.onclick=()=>scrollTo({top:0,left:0,behavior:"smooth"});
function prog(){const d=document.documentElement,m=d.scrollHeight-innerHeight;document.getElementById("prog").style.transform="scaleX("+(m>0?Math.min(1,scrollY/m):0)+")";tt.classList.toggle("show",scrollY>600)}
addEventListener("scroll",prog,{passive:true});addEventListener("resize",prog);
document.addEventListener("mousemove",e=>{const c=e.target.closest&&e.target.closest(".spot");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")}},{passive:true});
const app=document.getElementById("app"),ptb=document.getElementById("ptbar"),rmq=matchMedia("(prefers-reduced-motion:reduce)");
let pt;
function enter(){app.classList.remove("pt-out");app.classList.add("pt-in");clearTimeout(pt);pt=setTimeout(()=>app.classList.remove("pt-in"),600)}
function go(){
 if(rmq.matches){render();scrollTo({top:0,left:0,behavior:"instant"});return}
 clearTimeout(pt);ptb.classList.remove("go");void ptb.offsetWidth;ptb.classList.add("go");
 app.classList.remove("pt-in");app.classList.add("pt-out");
 pt=setTimeout(()=>{render();scrollTo({top:0,left:0,behavior:"instant"});enter()},230)}
addEventListener("hashchange",go);
render();enter();
</script>
