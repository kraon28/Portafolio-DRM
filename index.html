/* Dynamic Route View Transitions */
#app{transition:opacity .3s var(--ease-smooth),transform .3s var(--ease-smooth),filter .3s var(--ease-smooth)}
#app.pt-out{opacity:0;transform:translateY(16px) scale(.99);filter:blur(6px)}

#ptbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:61;opacity:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,transparent,#c8f560,rgba(200,245,96,.8));box-shadow:0 0 14px rgba(200,245,96,.9);pointer-events:none}

/* 7 HHEP · Centered Badge Line Alignment & Non-Text HUD Visualizer */
.spin{animation:spin 20s linear infinite}

.hh-hero{position:relative}.hh-hero>*{position:relative;z-index:1}.hh-hero>.glow{position:absolute;z-index:0}
.hh-top{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,72px);align-items:center}

.hh-seven::after{content:'';position:absolute;inset:-9%;border-radius:50%;border:1px solid rgba(200,245,96,.25);animation:ping 3.6s ease-out infinite}

.hh-seven i::after{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ac);box-shadow:0 0 16px var(--ac)}
